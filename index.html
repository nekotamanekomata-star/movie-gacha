<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アマプラ映画あらすじガチャ</title>
    <style>
        :root {
            --bg-color: #f4eae1;
            --card-bg: #ffffff;
            --text-color: #4a3e3d;
            --btn-main: #b88e76;
            --btn-main-hover: #a37a63;
            --btn-gacha: #d2b48c;
            --btn-x: #473f3e;
            --btn-x-hover: #2d2726;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 8px 24px rgba(74, 62, 61, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 0.05em;
        }
        .story-card {
            width: 100%;
            min-height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 30px;
            padding: 10px 5px;
            font-weight: 500;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .btn-main {
            background-color: var(--btn-main);
            color: white;
        }
        .btn-main:hover {
            background-color: var(--btn-main-hover);
        }
        .btn-gacha {
            background-color: var(--btn-gacha);
            color: #4a3e3d;
        }
        .btn-x {
            background-color: var(--btn-x);
            color: white;
            font-size: 0.95rem;
        }
        .btn-x:hover {
            background-color: var(--btn-x-hover);
        }
        .btn-secondary {
            background-color: transparent;
            color: #8c7e7d;
            border: 2px dashed #dcd0c5;
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 0.9rem;
        }
        .btn-secondary:hover {
            background-color: #fff9f5;
        }
        .loading {
            color: #8c7e7d;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">アマプラ映画あらすじガチャ</div>
    
    <div class="story-card" id="story-text">
        <span class="loading">映画データを読み込み中...</span>
    </div>

    <a href="#" target="_blank" id="amazon-btn" class="btn btn-main" style="display: none;">
        <span>▷ この映画をみる</span>
    </a>

    <button id="next-btn" class="btn btn-main btn-gacha" style="display: none;">
        <span>🎲 次の映画を引く！</span>
    </button>

    <a href="#" target="_blank" id="x-btn" class="btn btn-x" style="display: none;">
        <span>𝕏 ガチャの結果をシェアする</span>
    </a>

    <a href="https://google.com" target="_blank" class="btn btn-secondary">
        <span>✎ 好きな映画のあらすじを投稿する</span>
    </a>
</div>

<!-- セキュリティ制限（CORS）を100%回避してデータを読み込めるGoogle公式のスクリプト -->
<script src="https://google.com"></script>
<script>
    // あなたが見つけてくれた本物の公開URLからスプレッドシートのIDを安全に切り抜いたもの
    const sheetUrl = "https://google.com";

    let movies = [];

    // ブラウザのブロックを完全にすり抜けるGoogle公式のデータ読み込み機能
    google.load("visualization", "1", { packages: ["corechart"] });
    google.setOnLoadCallback(loadMovies);

    function loadMovies() {
        // 見出しの形式や空白に一切邪魔されない、クエリ形式で機械的に読み込み
        const query = new google.visualization.Query(sheetUrl);
        query.send(function(response) {
            if (response.isError()) {
                console.error(response.getMessage());
                document.getElementById('story-text').innerText = 'データの連動に失敗しました。時間をおいて再読み込みしてください。';
                return;
            }

            const data = response.getDataTable();
            const rowCount = data.getNumberOfRows();

            for (let i = 0; i < rowCount; i++) {
                // 列の見出し文字に関係なく、左から0番目(A列)=タイトル、1番目(B列)=あらすじ、2番目(C列)=リンクを強制回収
                const titleStr = data.getFormattedValue(i, 0);
                const storyStr = data.getFormattedValue(i, 1);
                const linkStr = data.getFormattedValue(i, 2);

                if (storyStr && storyStr.trim() !== "") {
                    movies.push({
                        title: titleStr,
                        story: storyStr,
                        link: linkStr
                    });
                }
            }

            if (movies.length > 0) {
                document.getElementById('next-btn').style.display = 'flex';
                document.getElementById('amazon-btn').style.display = 'flex';
                document.getElementById('x-btn').style.display = 'flex';
                drawGacha();
            } else {
                document.getElementById('story-text').innerText = '映画データが空っぽです。フォームから追加してください。';
            }
        });
    }

    function drawGacha() {
        if (movies.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * movies.length);
        const selectedMovie = movies[randomIndex];

        // あらすじ（B列）を表示
        document.getElementById('story-text').innerText = selectedMovie.story;
        
        // Amazonボタン（C列）
        const amazonBtn = document.getElementById('amazon-btn');
        if (selectedMovie.link) {
            amazonBtn.href = selectedMovie.link;
            amazonBtn.style.display = 'flex';
        } else {
            amazonBtn.style.display = 'none';
        }

        // Xシェア
        const currentUrl = window.location.href;
        const xBtn = document.getElementById('x-btn');
        const shareText = encodeURIComponent(`【アマプラ映画あらすじガチャ】この映画、な〜んだ？\n\n「${selectedMovie.story.substring(0, 50)}...」`);
        xBtn.href = `https://x.com{shareText}&url=${encodeURIComponent(currentUrl)}`;
    }

    document.getElementById('next-btn').addEventListener('click', drawGacha);
</script>

</body>
</html>
