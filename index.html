<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>アマプラ映画あらすじガチャ</title>

    <style>
        :root {
            --bg-color: #f4eae1;
            --card-bg: #ffffff;
            --text-color: #4a3e3d;
            --btn-main: #b88e76;
            --btn-main-hover: #a37a63;
            --btn-gacha: #d2b48c;
            --btn-gacha-hover: #c19e70;
            --btn-x: #473f3e;
            --btn-x-hover: #2d2726;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family:
                "Helvetica Neue",
                Arial,
                "Hiragino Kaku Gothic ProN",
                "Hiragino Sans",
                Meiryo,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-color);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;

            background: var(--card-bg);
            border-radius: 24px;

            padding: 30px 24px;

            box-shadow:
                0 8px 24px rgba(74, 62, 61, 0.08);

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;

            margin-bottom: 24px;

            letter-spacing: 0.05em;
        }

        /* =====================================================
           あらすじ
           ===================================================== */

        .story-card {
            width: 100%;
            min-height: 140px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 1.05rem;
            line-height: 1.7;

            margin-bottom: 24px;
            padding: 10px 5px;

            font-weight: 500;
        }

        .story-text {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .loading {
            color: #8c7e7d;
            font-style: italic;
        }

        .error {
            color: #a65d50;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        /* =====================================================
           ボタン共通
           ===================================================== */

        .btn {
            width: 100%;

            padding: 15px;

            border-radius: 14px;

            font-size: 1rem;
            font-weight: bold;

            border: none;
            cursor: pointer;

            transition:
                background-color 0.2s ease,
                transform 0.1s ease;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            text-decoration: none;

            margin-bottom: 12px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* =====================================================
           Amazonボタン
           ===================================================== */

        .btn-main {
            background-color: var(--btn-main);
            color: white;
        }

        .btn-main:hover {
            background-color: var(--btn-main-hover);
        }

        /* =====================================================
           ガチャボタン
           ===================================================== */

        .btn-gacha {
            background-color: var(--btn-gacha);
            color: #4a3e3d;
        }

        .btn-gacha:hover {
            background-color: var(--btn-gacha-hover);
        }

        /* =====================================================
           Xボタン
           ===================================================== */

        .btn-x {
            background-color: var(--btn-x);
            color: white;
            font-size: 0.95rem;
        }

        .btn-x:hover {
            background-color: var(--btn-x-hover);
        }

        /* =====================================================
           投稿ボタン
           ===================================================== */

        .btn-secondary {
            background-color: transparent;
            color: #8c7e7d;

            border: 2px dashed #dcd0c5;

            margin-top: 10px;
            margin-bottom: 0;

            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background-color: #fff9f5;
        }

        /* =====================================================
           ねこちゃん
           ===================================================== */

        .illustration-box {
            width: 280px;
            height: 280px;

            margin-top: 24px;
            margin-bottom: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        /* =====================================================
           非表示
           ===================================================== */

        .hidden {
            display: none !important;
        }

        /* =====================================================
           ステータス
           ===================================================== */

        .status {
            font-size: 0.75rem;
            color: #aaa09d;

            margin-top: 12px;
        }

    </style>
</head>

<body>

<div class="container">

    <!-- タイトル -->
    <div class="title">
        アマプラ映画あらすじガチャ
    </div>


    <!-- =====================================================
         あらすじ
         ===================================================== -->

    <div class="story-card" id="story-text">

        <span class="loading">
            映画データを読み込み中……
        </span>

    </div>


    <!-- =====================================================
         Amazonボタン
         ===================================================== -->

    <a
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        id="amazon-btn"
        class="btn btn-main hidden"
    >
        <span>▷ この映画をみる</span>
    </a>


    <!-- =====================================================
         次の映画
         ===================================================== -->

    <button
        id="next-btn"
        class="btn btn-gacha hidden"
        type="button"
    >
        <span>🎲 次の映画を引く！</span>
    </button>


    <!-- =====================================================
         X
         ===================================================== -->

    <a
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        id="x-btn"
        class="btn btn-x hidden"
    >
        <span>𝕏 結果をツイートする</span>
    </a>


    <!-- =====================================================
         映画投稿フォーム
         ===================================================== -->

    <a
        href="https://docs.google.com/forms/d/e/1FAIpQLScRD2arhC8d55o3ng6GmWRBbUMBCT0n1Vlcb0qUKG9cUIaNmg/viewform"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-secondary"
    >
        <span>✎ 好きな映画のあらすじを投稿する</span>
    </a>


    <!-- ステータス -->
    <div id="status" class="status"></div>


    <!-- =====================================================
         ねこちゃん
         ===================================================== -->

    <div class="illustration-box">

        <img
            src="./HQteOS-bIAAoMx5.jpe"
            alt="ねこちゃん"
        >

    </div>

</div>


<script>

    /*
     * =========================================================
     * Googleスプレッドシートの公開CSV
     * =========================================================
     */

    const csvUrl =
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTtvGWtqMgg0X28hsIxK_L7y8dtku8zC2lhK9IqU5keIPywzkuSslq-OlZTBhuXj717K5gIN7-9q6Zd/pub?output=csv";


    /*
     * =========================================================
     * Googleフォームの質問文
     * =========================================================
     */

    const TITLE_HEADER =
        "映画のタイトルを教えてね";

    const STORY_HEADER =
        "あらすじを60～140字くらいで教えてね";

    const LINK_HEADER =
        "Amazonプライムの映画リンクを貼ってくれるとめちゃくちゃ助かります";


    /*
     * =========================================================
     * データ
     * =========================================================
     */

    let movies = [];

    let selectedMovie = null;


    /*
     * =========================================================
     * CSV解析
     *
     * あらすじの中にカンマや改行があっても
     * できるだけ正しく読み込む。
     * =========================================================
     */

    function parseCSV(text) {

        const rows = [];

        let row = [];
        let cell = "";

        let insideQuote = false;


        for (let i = 0; i < text.length; i++) {

            const char = text[i];
            const next = text[i + 1];


            /*
             * ダブルクォーテーション
             */

            if (char === '"') {

                if (insideQuote && next === '"') {

                    cell += '"';

                    i++;

                } else {

                    insideQuote = !insideQuote;

                }

                continue;
            }


            /*
             * カンマ
             */

            if (char === "," && !insideQuote) {

                row.push(cell);

                cell = "";

                continue;
            }


            /*
             * 改行
             */

            if (
                (char === "\n" || char === "\r") &&
                !insideQuote
            ) {

                if (
                    char === "\r" &&
                    next === "\n"
                ) {

                    i++;

                }


                row.push(cell);


                /*
                 * 完全な空行は無視
                 */

                if (
                    row.some(
                        value =>
                            value.trim() !== ""
                    )
                ) {

                    rows.push(row);

                }


                row = [];

                cell = "";

                continue;
            }


            /*
             * 通常の文字
             */

            cell += char;
        }


        /*
         * ファイル末尾
         */

        if (
            cell.length > 0 ||
            row.length > 0
        ) {

            row.push(cell);


            if (
                row.some(
                    value =>
                        value.trim() !== ""
                )
            ) {

                rows.push(row);

            }
        }


        return rows;
    }


    /*
     * =========================================================
     * 見出しを探す
     *
     * Googleフォームの質問文は長いので、
     * 一部が一致すればその列として扱う。
     * =========================================================
     */

    function findHeaderIndex(
        headers,
        searchText
    ) {

        return headers.findIndex(
            header =>
                header
                    .replace(/^\uFEFF/, "")
                    .trim()
                    .includes(searchText)
        );

    }


    /*
     * =========================================================
     * 映画データ読み込み
     * =========================================================
     */

    async function loadMovies() {

        const storyText =
            document.getElementById(
                "story-text"
            );


        try {

            storyText.innerHTML =
                `
                <span class="loading">
                    映画データを読み込み中……
                </span>
                `;


            /*
             * CSV取得
             */

            const response =
                await fetch(
                    csvUrl,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "CSVを取得できませんでした"
                );

            }


            /*
             * CSV本文
             */

            const text =
                await response.text();


            /*
             * CSV解析
             */

            const rows =
                parseCSV(text);


            /*
             * データ確認
             */

            if (rows.length < 2) {

                throw new Error(
                    "スプレッドシートに映画データがありません"
                );

            }


            /*
             * 1行目は見出し
             */

            const headers =
                rows[0];


            /*
             * 列を検索
             */

            const titleIndex =
                findHeaderIndex(
                    headers,
                    TITLE_HEADER
                );


            const storyIndex =
                findHeaderIndex(
                    headers,
                    STORY_HEADER
                );


            const linkIndex =
                findHeaderIndex(
                    headers,
                    LINK_HEADER
                );


            /*
             * タイトル列確認
             */

            if (titleIndex === -1) {

                console.error(
                    "タイトル列が見つかりません",
                    headers
                );

                throw new Error(
                    "タイトルの列が見つかりませんでした"
                );

            }


            /*
             * あらすじ列確認
             */

            if (storyIndex === -1) {

                console.error(
                    "あらすじの列が見つかりません",
                    headers
                );

                throw new Error(
                    "あらすじの列が見つかりませんでした"
                );

            }


            /*
             * 映画データを作成
             */

            movies =
                rows
                    .slice(1)
                    .map(row => {

                        return {

                            title:
                                (
                                    row[titleIndex] ||
                                    ""
                                ).trim(),

                            story:
                                (
                                    row[storyIndex] ||
                                    ""
                                ).trim(),

                            link:
                                linkIndex !== -1
                                    ? (
                                        row[linkIndex] ||
                                        ""
                                    ).trim()
                                    : ""
                        };

                    })


                    /*
                     * あらすじが空の行を除外
                     */

                    .filter(
                        movie =>
                            movie.story.length > 0
                    );


            /*
             * 映画がない
             */

            if (movies.length === 0) {

                throw new Error(
                    "あらすじが入っている映画データがありません"
                );

            }


            /*
             * コンソールにも作品数を表示
             */

            console.log(
                "読み込んだ映画数:",
                movies.length
            );


            /*
             * ガチャボタンを表示
             */

            document
                .getElementById(
                    "next-btn"
                )
                .classList
                .remove("hidden");


            /*
             * 最初のガチャ
             */

            drawGacha();


            /*
             * ステータス
             */

            document
                .getElementById(
                    "status"
                )
                .textContent =
                    `${movies.length}作品からガチャしています`;


        } catch (error) {

            console.error(
                "映画データ読み込みエラー:",
                error
            );


            storyText.innerHTML =
                `
                <span class="error">
                    映画データの読み込みに失敗しました。<br>
                    ページを再読み込みしてみてください。
                </span>
                `;


            document
                .getElementById(
                    "status"
                )
                .textContent =
                    error.message;

        }

    }


    /*
     * =========================================================
     * ガチャ
     * =========================================================
     */

    function drawGacha() {

        if (movies.length === 0) {

            return;

        }


        /*
         * ランダムに選ぶ
         */

        const randomIndex =
            Math.floor(
                Math.random() *
                movies.length
            );


        selectedMovie =
            movies[randomIndex];


        /*
         * =====================================================
         * あらすじ表示
         *
         * タイトルは絶対に表示しない！
         * =====================================================
         */

        document
            .getElementById(
                "story-text"
            )
            .textContent =
                selectedMovie.story;


        /*
         * =====================================================
         * Amazonボタン
         * =====================================================
         */

        const amazonBtn =
            document.getElementById(
                "amazon-btn"
            );


        if (
            selectedMovie.link &&
            /^https?:\/\//i.test(
                selectedMovie.link
            )
        ) {

            amazonBtn.href =
                selectedMovie.link;

            amazonBtn
                .classList
                .remove("hidden");

        } else {

            amazonBtn
                .classList
                .add("hidden");

        }


        /*
         * =====================================================
         * Xシェア
         * =====================================================
         *
         * ハッシュタグを使用。
         *
         * あらすじは投稿全体が長くなりすぎないように
         * 自動的に途中でカットする。
         * ===================================================== */

        const xBtn =
            document.getElementById(
                "x-btn"
            );


        /*
         * X投稿の最大文字数
         */

        const X_MAX_LENGTH = 140;


        /*
         * 投稿文の固定部分
         */

        const sharePrefix =
            `#アマプラ映画あらすじガチャ\n\n` +
            `この映画、な〜んだ？🎬\n\n`;


        /*
         * あらすじを囲む記号
         */

        const storyStart = "「";
        const storyEnd = "」";


        /*
         * 念のため少し余裕を残す。
         *
         * URLは本文とは別の url パラメータで
         * 追加されるため、ここでは本文を安全側にする。
         */

        const SAFE_MARGIN = 20;


        /*
         * あらすじに使える文字数を計算
         */

        const maxStoryLength =
            X_MAX_LENGTH -
            sharePrefix.length -
            storyStart.length -
            storyEnd.length -
            SAFE_MARGIN;


        let storyForShare;


        /*
         * あらすじが長い場合は途中でカット
         */

        if (
            selectedMovie.story.length >
            maxStoryLength
        ) {

            storyForShare =
                selectedMovie.story.substring(
                    0,
                    maxStoryLength
                ) +
                "…";

        } else {

            storyForShare =
                selectedMovie.story;

        }


        /*
         * ツイート本文
         *
         * タイトルは伏せたまま。
         */

        const shareText =
            sharePrefix +
            storyStart +
            storyForShare +
            storyEnd;


        /*
         * =====================================================
         * 現在のサイトURL
         * =====================================================
         */

        const currentUrl =
            window.location.href;


        /*
         * =====================================================
         * X投稿URL
         *
         * URLは本文とは別に
         * urlパラメータで追加する。
         * =====================================================
         */

        xBtn.href =
            "https://twitter.com/intent/tweet" +
            "?text=" +
            encodeURIComponent(
                shareText
            ) +
            "&url=" +
            encodeURIComponent(
                currentUrl
            );


        /*
         * Xボタン表示
         */

        xBtn
            .classList
            .remove("hidden");

    }


    /*
     * =========================================================
     * 「次の映画を引く！」ボタン
     * =========================================================
     */

    document
        .getElementById(
            "next-btn"
        )
        .addEventListener(
            "click",
            drawGacha
        );


    /*
     * =========================================================
     * スタート
     * =========================================================
     */

    loadMovies();

</script>

</body>
</html>
