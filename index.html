<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>アマプラ映画あらすじガチャ</title>
    <style>
        :root {
            --bg-color: #f4eae1;
            --card-bg: #ffffff;
            --text-color: #4a3e3d;
            --btn-main: #b88e76;
            --btn-main-hover: #a37a63;
            --btn-x: #473f3e;
            --btn-x-hover: #2d2726;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 8px 24px rgba(74, 62, 61, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }
        .illustration-box {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
        }
        .illustration-box img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .story-card {
            width: 100%;
            min-height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 24px;
            padding: 10px 5px;
            font-weight: 500;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .btn-main {
            background-color: var(--btn-main);
            color: white;
        }
        .btn-main:hover {
            background-color: var(--btn-main-hover);
        }
        .btn-gacha {
            background-color: #d2b48c;
            color: #4a3e3d;
        }
        .btn-x {
            background-color: var(--btn-x);
            color: white;
            font-size: 0.95rem;
        }
        .btn-x:hover {
            background-color: var(--btn-x-hover);
        }
        .btn-secondary {
            background-color: transparent;
            color: #8c7e7d;
            border: 2px dashed #dcd0c5;
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 0.9rem;
        }
        .btn-secondary:hover {
            background-color: #fff9f5;
        }
        .loading {
            color: #8c7e7d;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">アマプラ映画あらすじガチャ</div>
    
    <div class="illustration-box">
        <!-- 直接アップロードしてくれたねこちゃん画像URL -->
        <img src="https://googleapis.com" alt="ねこちゃん">
    </div>

    <div class="story-card" id="story-text">
        <span class="loading">映画データを読み込み中...</span>
    </div>

    <a href="#" target="_blank" id="amazon-btn" class="btn btn-main" style="display: none;">
        <span>▷ この映画をみる</span>
    </a>

    <button id="next-btn" class="btn btn-main btn-gacha" style="display: none;">
        <span>🎲 次の映画を引く！</span>
    </button>

    <a href="#" target="_blank" id="x-btn" class="btn btn-x" style="display: none;">
        <span>𝕏 ガチャの結果をシェアする</span>
    </a>

    <a href="https://google.com" target="_blank" class="btn btn-secondary">
        <span>✎ 好きな映画のあらすじを投稿する</span>
    </a>
</div>

<script>
    // CSV形式でスプレッドシートから直接安全に引っこ抜く設定
    const sheetId = '1NjDui97vdLI6rJXmPGUi8Pz1oU1tBuFKsMocapp6upk';
    const csvUrl = `https://google.com{sheetId}/pub?output=csv`;

    let movies = [];

    // CSVをパースする関数
    function parseCSV(text) {
        const lines = text.split('\n');
        const result = [];
        
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            
            // カンマ区切りの単純パース（クォーテーション対応）
            let row = [];
            let insideQuote = false;
            let entry = '';
            
            for (let j = 0; j < lines[i].length; j++) {
                let char = lines[i][j];
                if (char === '"') {
                    insideQuote = !insideQuote;
                } else if (char === ',' && !insideQuote) {
                    row.push(entry.trim());
                    entry = '';
                } else {
                    entry += char;
                }
            }
            row.push(entry.trim());
            
            if (row[1]) { // あらすじがある場合
                result.push({
                    title: row[0] ? row[0].replace(/^"|"$/g, '') : '',
                    story: row[1] ? row[1].replace(/^"|"$/g, '').replace(/""/g, '"') : '',
                    link: row[2] ? row[2].replace(/^"|"$/g, '') : ''
                });
            }
        }
        return result;
    }

    async function loadMovies() {
        try {
            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error('Network error');
            const text = await response.text();
            
            movies = parseCSV(text);

            if(movies.length > 0) {
                document.getElementById('next-btn').style.display = 'flex';
                document.getElementById('amazon-btn').style.display = 'flex';
                document.getElementById('x-btn').style.display = 'flex';
                drawGacha();
            } else {
                document.getElementById('story-text').innerText = '映画データが見つかりませんでした。';
            }
        } catch (error) {
            console.error(error);
            document.getElementById('story-text').innerText = 'データの読み込みに失敗しました。ウェブに公開されているか確認してください。';
        }
    }

    function drawGacha() {
        if (movies.length === 0) return;
        
        const randomIndex = Math.floor(Math.random() * movies.length);
        const selectedMovie = movies[randomIndex];

        document.getElementById('story-text').innerText = selectedMovie.story;
        
        const amazonBtn = document.getElementById('amazon-btn');
        if (selectedMovie.link) {
            amazonBtn.href = selectedMovie.link;
            amazonBtn.style.display = 'flex';
        } else {
            amazonBtn.style.display = 'none';
        }

        const currentUrl = window.location.href;
        const xBtn = document.getElementById('x-btn');
        const shareText = encodeURIComponent(`【アマプラ映画あらすじガチャ】この映画、な〜んだ？\n\n「${selectedMovie.story.substring(0, 55)}...」`);
        xBtn.href = `https://x.com{shareText}&url=${encodeURIComponent(currentUrl)}`;
    }

    document.getElementById('next-btn').addEventListener('click', drawGacha);
    loadMovies();
</script>

</body>
</html>
